name: Validate blocklists

on:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate lists
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
